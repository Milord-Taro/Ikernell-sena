# ================= Base de datos (prod) =================
# En producción todo viene por variable de entorno, sin valores por defecto.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ================= JPA / Hibernate =================
spring.jpa.show-sql=false

# ================= Logging =================
logging.level.org.springframework.web=WARN
logging.level.com.ikernell=INFO

# ================= JWT =================
# Sin valor por defecto a propósito: si falta la variable de entorno en
# producción, la app debe fallar al arrancar en vez de usar un secreto inseguro.
jwt.secret=${JWT_SECRET}
# 30 minutos en milisegundos
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

# ================= CORS =================
# Sin valor por defecto, igual que jwt.secret: en producción el dominio del
# frontend SIEMPRE debe declararse explícito -- un default aquí sería fácil
# de olvidar y terminar exponiendo la API a cualquier origen por accidente.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ================= Documentación API (Swagger / OpenAPI) =================
# Apagada en producción a propósito -- documentación interactiva de la API
# (con "Try it out" incluido) no debe quedar pública fuera de desarrollo.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

