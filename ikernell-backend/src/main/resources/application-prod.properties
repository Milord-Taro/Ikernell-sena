# ================= Base de datos (prod) =================
# En producción todo viene por variable de entorno, sin valores por defecto.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ================= JPA / Hibernate =================
spring.jpa.show-sql=false

# ================= Logging =================
logging.level.org.springframework.web=WARN
logging.level.com.ikernell=INFO

# ================= JWT =================
# Sin valor por defecto a propósito: si falta la variable de entorno en
# producción, la app debe fallar al arrancar en vez de usar un secreto inseguro.
jwt.secret=${JWT_SECRET}
# 1 hora en milisegundos
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}

