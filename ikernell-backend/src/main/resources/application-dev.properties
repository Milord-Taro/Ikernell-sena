# ================= Base de datos (dev) =================
# Valores por defecto que funcionan al clonar el repo en cualquier máquina
# con PostgreSQL local configurado con usuario/clave estándar del proyecto.
# Si tu máquina necesita otro valor, créalo en application-local.properties
# (no versionado) y se sobreescribe automáticamente gracias al import de abajo.
spring.datasource.url=jdbc:postgresql://localhost:5432/ikernell_v2
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Import del archivo local: al estar declarado aquí (dentro del perfil dev),
# sí tiene precedencia sobre los valores de arriba si el archivo existe.
spring.config.import=optional:file:./application-local.properties

# ================= JPA / Hibernate =================
spring.jpa.show-sql=true

# ================= Logging =================
logging.level.org.springframework.web=DEBUG
logging.level.com.ikernell=DEBUG

# ================= JWT =================
# Secreto de desarrollo. NO usar en producción (ahí va SOLO por variable de entorno).
jwt.secret=${JWT_SECRET:ikernell-secreto-de-desarrollo-cambia-esto-en-produccion-2026}
# 8 horas en milisegundos
jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

