# ================= Aplicación =================
spring.application.name=ikernell-backend

# Perfil activo por defecto (se puede sobreescribir con la variable de entorno SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ================= Servidor =================
server.port=8080

# ================= Migraciones de schema (Flyway) =================
# Ejecuta automáticamente los scripts de db/migration/ al arrancar --
# ver V1__baseline.sql para el detalle completo de esta política.
#
# baseline-on-migrate=true: necesario porque este proyecto adoptó Flyway
# con bases de datos que YA existían (creadas antes a mano con
# schema.sql) -- sin esto, Flyway falla al arrancar porque encuentra
# tablas que no reconoce ("Found non-empty schema without metadata
# table"). Con esto, si la base ya tiene el schema de V1 físicamente
# creado, Flyway simplemente marca V1 como aplicado (sin re-ejecutarlo)
# y sigue de ahí en adelante. En una base realmente vacía (instalación
# nueva) esta opción no hace nada -- Flyway corre V1 de forma normal.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ================= JPA / Hibernate (comportamiento por defecto, cada perfil puede sobreescribir) =================
# CORREGIDO: antes "none" -- Hibernate no verificaba que las entidades
# JPA coincidieran con la base real, así que un desajuste (columna que
# falta, tipo distinto) solo se descubría en producción, con la primera
# query que la tocara, como un 500 sin explicación. Con "validate",
# Hibernate compara cada entidad contra el schema real al arrancar y la
# app falla de inmediato -- con un mensaje claro -- si no coinciden.
# Flyway ya es quien crea/actualiza el schema (ver arriba); Hibernate
# nunca debe modificarlo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
# CORREGIDO: todas las asociaciones son LAZY (correcto), pero sin esto
# Hibernate carga cada asociación LAZY con un SELECT individual por fila
# al mapear una lista a DTOs (ej. Actividad -> Etapa -> Proyecto, Usuario
# -> Rol/Profesion/Especialidad) -- un N+1 clásico. Con
# default_batch_fetch_size, Hibernate agrupa esas cargas pendientes en
# lotes de hasta 50 (SELECT ... WHERE id IN (?, ?, ..., ?)) en vez de una
# consulta por fila. No cambia el resultado, solo el número de queries.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

