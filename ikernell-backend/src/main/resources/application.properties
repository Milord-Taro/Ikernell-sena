# ================= Aplicación =================
spring.application.name=ikernell-backend

# Perfil activo por defecto (se puede sobreescribir con la variable de entorno SPRING_PROFILES_ACTIVE)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ================= Servidor =================
server.port=8080

# ================= JPA / Hibernate (comportamiento por defecto, cada perfil puede sobreescribir) =================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

