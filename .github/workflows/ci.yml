name: CI

# Compila y prueba backend y frontend en cada push y PR. La suite de
# backend NO necesita PostgreSQL: los tests unitarios son Mockito puro y el
# @SpringBootTest de integración está excluido por defecto (ver la property
# test.excluded.groups en ikernell-backend/pom.xml). Así el pipeline es verde
# en un runner limpio, sin servicios externos.

on:
  # push solo a main (post-merge). Las ramas de trabajo se cubren vía
  # pull_request, evitando que un PR del mismo repo dispare CI dos veces
  # (una por el push a la rama y otra por el evento pull_request).
  push:
    branches: [main]
  pull_request:

# Cancela ejecuciones viejas de la misma rama cuando llega un push nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 17 · compile + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ikernell-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compile + unit tests
        run: ./mvnw -B -ntp clean verify

  frontend:
    name: Frontend (Node 22 · typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ikernell-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ikernell-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Lint
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build
